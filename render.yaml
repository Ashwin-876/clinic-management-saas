databases:
  - name: clinic-postgres
    databaseName: clinic_db
    user: clinic_admin
    plan: free
    region: oregon

services:
  - type: web
    name: clinic-management-saas
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
